<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="140" cy="80" r="260" fill="url(#glow1)"/>
  <circle cx="1080" cy="560" r="280" fill="url(#glow2)"/>

  <text x="80" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#94a3b8" letter-spacing="1">KODSTIGEN</text>

  <text x="78" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#f8fafc">Three new courses.</text>
  <text x="78" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#brand)">27 lessons.</text>

  <text x="80" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94a3b8">Data Mining &#183; Big Data &#183; GSAP and ScrollTrigger</text>

  <g transform="translate(78,410)">
    <rect x="0" y="0" width="480" height="150" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#94a3b8">Runs in your browser</text>
    <rect x="24" y="62" width="128" height="34" rx="17" fill="#0f2b22" stroke="#134e4a" stroke-width="1.5"/>
    <text x="46" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#34d399">pandas</text>
    <rect x="164" y="62" width="150" height="34" rx="17" fill="#0f2b22" stroke="#134e4a" stroke-width="1.5"/>
    <text x="186" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#34d399">scikit-learn</text>
    <rect x="326" y="62" width="128" height="34" rx="17" fill="#0f2b22" stroke="#134e4a" stroke-width="1.5"/>
    <text x="352" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#34d399">GSAP</text>
    <text x="24" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">No installs. No account. Every block editable.</text>
  </g>

  <g transform="translate(620,400)">
    <rect x="0" y="0" width="500" height="180" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="24" cy="26" r="6" fill="#f87171"/>
    <circle cx="46" cy="26" r="6" fill="#fbbf24"/>
    <circle cx="68" cy="26" r="6" fill="#34d399"/>
    <text x="24" y="66" font-family="Consolas, 'Courier New', monospace" font-size="17">
      <tspan fill="#93c5fd">gsap</tspan>
      <tspan fill="#e2e8f0">.to(</tspan>
      <tspan fill="#fca5a5">'.box'</tspan>
      <tspan fill="#e2e8f0">, {</tspan>
    </text>
    <text x="44" y="92" font-family="Consolas, 'Courier New', monospace" font-size="17">
      <tspan fill="#c084fc">x</tspan>
      <tspan fill="#e2e8f0">: 220, </tspan>
      <tspan fill="#c084fc">rotation</tspan>
      <tspan fill="#e2e8f0">: 360,</tspan>
    </text>
    <text x="44" y="118" font-family="Consolas, 'Courier New', monospace" font-size="17">
      <tspan fill="#c084fc">ease</tspan>
      <tspan fill="#e2e8f0">: </tspan>
      <tspan fill="#fca5a5">'back.out(1.7)'</tspan>
    </text>
    <text x="24" y="144" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#e2e8f0">});</text>
    <rect x="20" y="156" width="460" height="1" fill="#1e293b"/>
  </g>
</svg>
