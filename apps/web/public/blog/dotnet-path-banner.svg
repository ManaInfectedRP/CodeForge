<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="140" cy="80" r="260" fill="url(#glow1)"/>
  <circle cx="1080" cy="560" r="280" fill="url(#glow2)"/>

  <text x="80" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#94a3b8" letter-spacing="1">KODSTIGEN</text>

  <text x="78" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#f8fafc">A new .NET path.</text>
  <text x="78" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#brand)">21 lessons.</text>

  <text x="80" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94a3b8">Foundations &#183; Intermediate &#183; Advanced</text>

  <g transform="translate(78,410)">
    <rect x="0" y="0" width="480" height="150" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#94a3b8">From your first project to production</text>
    <rect x="24" y="62" width="112" height="34" rx="17" fill="#1e1b4b" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="46" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#c4b5fd">LINQ</text>
    <rect x="148" y="62" width="128" height="34" rx="17" fill="#1e1b4b" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="170" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#c4b5fd">async</text>
    <rect x="288" y="62" width="166" height="34" rx="17" fill="#1e1b4b" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="310" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#c4b5fd">ASP.NET Core</text>
    <text x="24" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">Three courses. Three projects to submit.</text>
  </g>

  <g transform="translate(620,400)">
    <rect x="0" y="0" width="500" height="180" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="24" cy="26" r="6" fill="#f87171"/>
    <circle cx="46" cy="26" r="6" fill="#fbbf24"/>
    <circle cx="68" cy="26" r="6" fill="#34d399"/>
    <text x="24" y="72" font-family="Consolas, 'Courier New', monospace" font-size="17">
      <tspan fill="#93c5fd">ReadOnlySpan</tspan>
      <tspan fill="#e2e8f0">&#60;</tspan>
      <tspan fill="#93c5fd">char</tspan>
      <tspan fill="#e2e8f0">&#62; s = line;</tspan>
    </text>
    <text x="24" y="102" font-family="Consolas, 'Courier New', monospace" font-size="17">
      <tspan fill="#93c5fd">var</tspan>
      <tspan fill="#e2e8f0"> total = </tspan>
      <tspan fill="#c084fc">decimal</tspan>
      <tspan fill="#e2e8f0">.Parse(s[</tspan>
      <tspan fill="#fca5a5">i..</tspan>
      <tspan fill="#e2e8f0">]);</tspan>
    </text>
    <text x="24" y="140" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#64748b">// 0 allocations</text>
    <rect x="24" y="152" width="452" height="6" rx="3" fill="#1e293b"/>
    <rect x="24" y="152" width="180" height="6" rx="3" fill="url(#brand)"/>
  </g>
</svg>
