# Render.com Blueprint for Kodstigen
# https://render.com/docs/blueprint-spec
#
# The whole site is a Next.js static export, no server and no database: `build.sh`
# runs `next build` (which writes apps/web/out because next.config.ts sets
# output: 'export') and Render serves those files straight from its CDN.
# https://render.com/docs/deploy-nextjs-app#deploy-as-a-static-site
#
# Deploy: push this repo to GitHub -> Render Dashboard -> New -> Blueprint.

services:
  - type: web
    name: codeforge
    runtime: static
    buildCommand: ./build.sh
    staticPublishPath: apps/web/out
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    # `trailingSlash: true` means every route is <route>/index.html, so no rewrites are
    # needed for deep links. Unknown paths fall through to the exported 404.html.
    headers:
      # hashed filenames, safe to cache forever
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
